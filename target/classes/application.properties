spring.application.name=proctoring-service
server.port=8081

# Base H2 (fichier) : les données survivent au redémarrage. Console : http://localhost:8081/h2-console
spring.datasource.url=jdbc:h2:file:./data/proctoring;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Secrets partagés avec le backend Node (valeurs de développement, déjà alignées sur le .env de Node) ---
# proctoring.jwt-secret    = EXACTEMENT la même valeur que JWT_SECRET dans le .env de Node
# proctoring.service-key   = EXACTEMENT la même valeur que PROCTORING_SERVICE_KEY dans le .env de Node
# (en production : utiliser des variables d'environnement, ne jamais publier ces valeurs)
proctoring.jwt-secret=change_me_long_random_string_at_least_32_chars
proctoring.service-key=une-cle-de-service-1234567890

# --- API externe gratuite de géolocalisation IP (même principe que OpenWeatherMap au TP6) ---
proctoring.geo.url=${GEO_API_URL:https://ipwho.is/}

# CORS : utile seulement si l'app Flutter tourne en web (ex: http://localhost:5000)
proctoring.cors-origins=${CORS_ORIGIN:*}

# true uniquement derrière un reverse proxy de confiance (sinon un candidat peut falsifier son IP)
proctoring.trust-forwarded-for=false
